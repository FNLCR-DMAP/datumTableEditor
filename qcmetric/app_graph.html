    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            font-family: 'Segoe UI', monospace;
            overflow: hidden;
        }
        #graph {
            width: 100vw;
            height: 100vh;
        }
        .node {
            cursor: pointer;
        }
        .node text {
            font-size: 10px;
            fill: white;
            pointer-events: none;
        }
        .link {
            stroke: #555;
            stroke-opacity: 0.6;
            fill: none;
        }
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
            max-width: 300px;
        }
        #legend {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            z-index: 100;
        }
        #legend h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        #controls {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            z-index: 100;
        }
        #controls button {
            background: #3498db;
            border: none;
            color: white;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        #controls button:hover {
            background: #2980b9;
        }
        #stats {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 10px 15px;
            border-radius: 8px;
            color: #aaa;
            font-size: 11px;
        }
    </style>

        const width = window.innerWidth;
        const height = window.innerHeight;
        
        const svg = d3.select("#graph")
            .attr("width", width)
            .attr("height", height);
        
        const g = svg.append("g");
        
        // Zoom behavior
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => g.attr("transform", event.transform));
        svg.call(zoom);
        
        // Arrow marker
        svg.append("defs").append("marker")
            .attr("id", "arrowhead")
            .attr("viewBox", "-0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("orient", "auto")
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .append("path")
            .attr("d", "M 0,-5 L 10,0 L 0,5")
            .attr("fill", "#555");
        
        // Force simulation
        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-200))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(30));
        
        // Links
        const link = g.append("g")
            .selectAll("path")
            .data(data.links)
            .join("path")
            .attr("class", "link")
            .attr("marker-end", "url(#arrowhead)");
        
        // Nodes
        const node = g.append("g")
            .selectAll("g")
            .data(data.nodes)
            .join("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));
        
        // Node shapes
        node.each(function(d) {
            const el = d3.select(this);
            const size = d.type === 'effect' || d.type === 'render' ? 10 : 7;
            
            if (d.type === 'effect') {
                // Diamond
                el.append("path")
                    .attr("d", d3.symbol().type(d3.symbolDiamond).size(size * 20))
                    .attr("fill", d.color)
                    .attr("stroke", "white")
                    .attr("stroke-width", 1);
            } else if (d.type === 'render') {
                // Star
                el.append("path")
                    .attr("d", d3.symbol().type(d3.symbolStar).size(size * 20))
                    .attr("fill", d.color)
                    .attr("stroke", "white")
                    .attr("stroke-width", 1);
            } else {
                // Circle
                el.append("circle")
                    .attr("r", size)
                    .attr("fill", d.color)
                    .attr("stroke", "white")
                    .attr("stroke-width", 1);
            }
        });
        
        // Labels
        let showLabels = true;
        const labels = node.append("text")
            .text(d => d.label)
            .attr("x", 12)
            .attr("y", 4);
        
        // Tooltip
        const tooltip = d3.select(".tooltip");
        
        node.on("mouseover", function(event, d) {
            tooltip.style("display", "block")
                .html(`<b>${d.id}</b><br>
                       Module: ${d.module}<br>
                       Line: ${d.line}<br>
                       Type: ${d.type}<br>
                       ${d.decorators.length ? 'Decorators: @' + d.decorators.join(', @') : ''}`)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
            
            // Highlight connected
            link.style("stroke", l => (l.source.id === d.id || l.target.id === d.id) ? "#fff" : "#555")
                .style("stroke-width", l => (l.source.id === d.id || l.target.id === d.id) ? 2 : 1);
        })
        .on("mouseout", function() {
            tooltip.style("display", "none");
            link.style("stroke", "#555").style("stroke-width", 1);
        });
        
        // Tick
        simulation.on("tick", () => {
            link.attr("d", d => {
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                return `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`;
            });
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
        
        // Drag functions
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }
        
        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }
        
        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
        
        // Controls
        function resetZoom() {
            svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
        }
        
        function toggleLabels() {
            showLabels = !showLabels;
            labels.style("display", showLabels ? "block" : "none");
        }
        
        let physicsEnabled = true;
        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
            if (physicsEnabled) {
                simulation.alpha(0.3).restart();
            } else {
                simulation.stop();
            }
        }
