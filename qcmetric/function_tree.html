<!DOCTYPE html>
<html>
<head>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace;
            background: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #58a6ff;
            font-weight: 400;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 30px;
        }
        #tree-container {
            width: 100%;
            overflow-x: auto;
        }
        .node {
            cursor: pointer;
        }
        .node circle {
            stroke-width: 2px;
        }
        .node text {
            font-size: 12px;
            fill: #c9d1d9;
        }
        .node--leaf text {
            font-size: 11px;
            fill: #8b949e;
        }
        .link {
            fill: none;
            stroke: #30363d;
            stroke-width: 1.5px;
        }
        .connection {
            fill: none;
            stroke: #ff69b4;
            stroke-width: 1px;
            stroke-opacity: 0.4;
            pointer-events: none;
        }
        .connection.highlight {
            stroke-opacity: 0.9;
            stroke-width: 2px;
        }
        .tooltip {
            position: absolute;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .tooltip strong {
            color: #58a6ff;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px 25px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #58a6ff;
        }
        .stat-label {
            font-size: 12px;
            color: #8b949e;
            margin-top: 5px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        #controls {
            text-align: center;
            margin-bottom: 20px;
        }
        #controls button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 5px;
            font-size: 13px;
        }
        #controls button:hover {
            background: #30363d;
        }
    </style>
</head>

        <div class="stat-box">

        <button onclick="collapseAll()">Collapse All</button>
        <button onclick="toggleConnections()">Toggle Connections</button>

ask", "sourceModule": "modal_utils", "targetModule": "modal_utils"}, {"source": "build_filter_column_buttons", "target": "_mask", "sourceModule": "modal_utils", "targetModule": "modal_utils"}, {"source": "build_operator_filter_element", "target": "_mask", "sourceModule": "modal_utils", "targetModule": "modal_utils"}, {"source": "build_dynamic_filter_element", "target": "_mask", "sourceModule": "modal_utils", "targetModule": "modal_utils"}, {"source": "build_dynamic_filters_panel", "target": "_is_operator_filter", "sourceModule": "modal_utils", "targetModule": "filter_utils"}, {"source": "build_dynamic_filters_panel", "target": "_looks_like_dates", "sourceModule": "modal_utils", "targetModule": "modal_utils"}, {"source": "build_dynamic_filters_panel", "target": "build_dynamic_filter_element", "sourceModule": "modal_utils", "targetModule": "modal_utils"}, {"source": "build_dynamic_filters_panel", "target": "build_dynamic_filter_element", "sourceModule": "modal_utils", "targetModule": "modal_utils"}, {"source": "build_dynamic_filters_panel", "target": "_looks_like_dates", "sourceModule": "modal_utils", "targetModule": "modal_utils"}, {"source": "main", "target": "process_and_save", "sourceModule": "process_mods", "targetModule": "process_mods"}, {"source": "export_transformations", "target": "_export_as_csv", "sourceModule": "process_mods", "targetModule": "process_mods"}, {"source": "export_transformations", "target": "_export_as_json", "sourceModule": "process_mods", "targetModule": "process_mods"}, {"source": "export_transformations", "target": "_export_as_sql", "sourceModule": "process_mods", "targetModule": "process_mods"}, {"source": "process_and_save", "target": "load_original_data", "sourceModule": "process_mods", "targetModule": "process_mods"}, {"source": "process_and_save", "target": "load_modifications", "sourceModule": "process_mods", "targetModule": "process_mods"}, {"source": "process_and_save", "target": "apply_modifications", "sourceModule": "process_mods", "targetModule": "process_mods"}, {"source": "process_and_save", "target": "get_change_summary", "sourceModule": "process_mods", "targetModule": "process_mods"}, {"source": "process_and_save", "target": "export_transformations", "sourceModule": "process_mods", "targetModule": "process_mods"}, {"source": "process_and_save", "target": "export_transformations", "sourceModule": "process_mods", "targetModule": "process_mods"}, {"source": "process_and_save", "target": "export_transformations", "sourceModule": "process_mods", "targetModule": "process_mods"}];
        let showConnections = true;
        
        const margin = {top: 20, right: 120, bottom: 20, left: 180};
        const width = Math.max(1400, window.innerWidth - 40);
        const baseHeight = 800;
        
        const svg = d3.select("#tree-container")
            .append("svg")
            .attr("width", width)
            .attr("height", baseHeight);
        
        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);
        
        // Zoom
        const zoom = d3.zoom()
            .scaleExtent([0.3, 3])
            .on("zoom", (event) => g.attr("transform", event.transform));
        svg.call(zoom);
        
        const root = d3.hierarchy(treeData);
        root.x0 = baseHeight / 2;
        root.y0 = 0;
        
        // Collapse all except first level
        root.children.forEach(collapse);
        
        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }
        
        function expand(d) {
            if (d._children) {
                d.children = d._children;
                d._children = null;
            }
            if (d.children) {
                d.children.forEach(expand);
            }
        }
        
        const tooltip = d3.select(".tooltip");
        
        function update(source) {
            const treeLayout = d3.tree().nodeSize([22, 200]);
            treeLayout(root);
            
            // Compute new height
            let minY = Infinity, maxY = -Infinity;
            root.each(d => {
                if (d.x < minY) minY = d.x;
                if (d.x > maxY) maxY = d.x;
            });
            const newHeight = maxY - minY + margin.top + margin.bottom + 100;
            svg.attr("height", Math.max(baseHeight, newHeight));
            
            const nodes = root.descendants();
            const links = root.links();
            
            // Normalize y position
            nodes.forEach(d => { d.y = d.depth * 200; });
            
            // Nodes
            const node = g.selectAll(".node")
                .data(nodes, d => d.data.name);
            
            const nodeEnter = node.enter()
                .append("g")
                .attr("class", d => "node" + (d.children || d._children ? "" : " node--leaf"))
                .attr("transform", d => `translate(${source.y0 || 0},${source.x0 || 0})`)
                .on("click", (event, d) => {
                    if (d.children) {
                        d._children = d.children;
                        d.children = null;
                    } else if (d._children) {
                        d.children = d._children;
                        d._children = null;
                    }
                    update(d);
                })
                .on("mouseover", (event, d) => {
                    if (d.data.module) {
                        const callsTo = (d.data.calls || []).slice(0, 10);
                        const calledBy = connections.filter(c => c.target === d.data.name).map(c => c.source).slice(0, 10);
                        let callInfo = '';
                        if (callsTo.length > 0) callInfo += `<br>Calls: ${callsTo.join(', ')}`;
                        if (calledBy.length > 0) callInfo += `<br>Called by: ${calledBy.join(', ')}`;
                        
                        tooltip.style("display", "block")
                            .html(`<strong>${d.data.name}</strong><br>
                                   Module: ${d.data.module}<br>
                                   Line: ${d.data.line}${d.data.decorators || ''}${callInfo}`)
                            .style("left", (event.pageX + 15) + "px")
                            .style("top", (event.pageY - 10) + "px");
                        
                        // Highlight connections
                        g.selectAll(".connection")
                            .classed("highlight", c => c.source === d.data.name || c.target === d.data.name);
                    }
                })
                .on("mouseout", () => {
                    tooltip.style("display", "none");
                    g.selectAll(".connection").classed("highlight", false);
                });
            
            nodeEnter.append("circle")
                .attr("r", d => d.children || d._children ? 6 : 4)
                .attr("fill", d => d.data.color || "#8b949e")
                .attr("stroke", d => d.children || d._children ? d.data.color || "#8b949e" : "none");
            
            nodeEnter.append("text")
                .attr("dy", "0.35em")
                .attr("x", d => d.children || d._children ? -12 : 10)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.name)
                .style("fill", d => d.data.module ? "#8b949e" : "#c9d1d9");
            
            // Add count badge for parent nodes
            nodeEnter.filter(d => d._children || d.children)
                .append("text")
                .attr("class", "count")
                .attr("dy", "0.35em")
                .attr("x", 12)
                .style("fill", "#8b949e")
                .style("font-size", "10px")
                .text(d => {
                    const count = (d._children || d.children || []).length;
                    return count > 0 ? `(${count})` : '';
                });
            
            const nodeUpdate = nodeEnter.merge(node);
            
            nodeUpdate.transition()
                .duration(300)
                .attr("transform", d => `translate(${d.y},${d.x})`);
            
            node.exit()
                .transition()
                .duration(300)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .remove();
            
            // Links
            const link = g.selectAll(".link")
                .data(links, d => d.target.data.name);
            
            const linkEnter = link.enter()
                .insert("path", "g")
                .attr("class", "link")
                .attr("d", d => {
                    const o = {x: source.x0 || 0, y: source.y0 || 0};
                    return diagonal(o, o);
                });
            
            linkEnter.merge(link)
                .transition()
                .duration(300)
                .attr("d", d => diagonal(d.source, d.target));
            
            link.exit()
                .transition()
                .duration(300)
                .attr("d", d => {
                    const o = {x: source.x, y: source.y};
                    return diagonal(o, o);
                })
                .remove();
            
            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
            
            // Draw connections between functions
            updateConnections();
        }
        
        function updateConnections() {
            // Build node position map
            const nodePositions = {};
            root.each(d => {
                if (d.data.module) {
                    nodePositions[d.data.name] = { x: d.x, y: d.y, visible: true };
                }
            });
            
            // Filter to only visible connections
            const visibleConnections = showConnections ? connections.filter(c => 
                nodePositions[c.source] && nodePositions[c.target]
            ) : [];
            
            const conn = g.selectAll(".connection")
                .data(visibleConnections, d => d.source + '-' + d.target);
            
            conn.enter()
                .insert("path", ".node")
                .attr("class", "connection")
                .attr("d", d => {
                    const s = nodePositions[d.source];
                    const t = nodePositions[d.target];
                    if (!s || !t) return "";
                    // Draw curved arc
                    const dx = t.y - s.y;
                    const dy = t.x - s.x;
                    const dr = Math.sqrt(dx * dx + dy * dy) * 0.8;
                    return `M${s.y},${s.x} A${dr},${dr} 0 0,1 ${t.y},${t.x}`;
                });
            
            conn.transition()
                .duration(300)
                .attr("d", d => {
                    const s = nodePositions[d.source];
                    const t = nodePositions[d.target];
                    if (!s || !t) return "";
                    const dx = t.y - s.y;
                    const dy = t.x - s.x;
                    const dr = Math.sqrt(dx * dx + dy * dy) * 0.8;
                    return `M${s.y},${s.x} A${dr},${dr} 0 0,1 ${t.y},${t.x}`;
                });
            
            conn.exit().remove();
        }
        
        function toggleConnections() {
            showConnections = !showConnections;
            updateConnections();
        }
        
        function diagonal(s, d) {
            return `M ${s.y} ${s.x}
                    C ${(s.y + d.y) / 2} ${s.x},
                      ${(s.y + d.y) / 2} ${d.x},
                      ${d.y} ${d.x}`;
        }
        
        function expandAll() {
            root.each(d => {
                if (d._children) {
                    d.children = d._children;
                    d._children = null;
                }
            });
            update(root);
        }
        
        function collapseAll() {
            root.children.forEach(collapse);
            update(root);
        }
        
        function resetView() {
            svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
        }
        
        update(root);
        
        // Initial slight zoom out for overview
        svg.call(zoom.transform, d3.zoomIdentity.translate(50, 100).scale(0.9));
    </script>
</body>
